<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile SCG Pro Monitor</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --alert-color: #ff1744;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--accent-color); }
        .instructions { font-size: 0.85rem; color: #aaaaaa; margin-bottom: 15px; line-height: 1.4; }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .metric-box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-label { font-size: 0.75rem; color: #aaaaaa; text-transform: uppercase; }
        .metric-value { font-size: 1.6rem; font-weight: bold; color: var(--accent-color); margin-top: 5px; }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .btn-start { background-color: var(--accent-color); color: #000; }
        .btn-stop { background-color: var(--alert-color); color: #fff; display: none; }
        .btn-export { background-color: #2979ff; color: #fff; display: none; }
        .status { text-align: center; font-weight: bold; margin: 10px 0; min-height: 24px; font-size: 0.95rem; }
        canvas {
            width: 100%;
            height: 220px;
            background-color: #050505;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mobile SCG Pro Monitor</h1>
    <div class="instructions">
        <strong>Protocol:</strong> Place the bare phone screen-up on your chest. Tap the button, breathe out completely, and hold still during the 3s countdown!
    </div>

    <div class="dashboard">
        <div class="metric-box">
            <div class="metric-label">Timer Status</div>
            <div id="timerVal" class="metric-value">15s</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Estimated HR</div>
            <div id="bpmVal" class="metric-value">-- BPM</div>
        </div>
    </div>

    <button id="startBtn" class="btn btn-start">Initialize Session</button>
    <button id="stopBtn" class="btn btn-stop">Emergency Cancel</button>
    <button id="exportBtn" class="btn btn-export">Export Session CSV</button>

    <div id="statusUpdate" class="status">Ready</div>
    <canvas id="scgChart"></canvas>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const exportBtn = document.getElementById('exportBtn');
    const statusUpdate = document.getElementById('statusUpdate');
    const timerVal = document.getElementById('timerVal');
    const bpmVal = document.getElementById('bpmVal');
    const canvas = document.getElementById('scgChart');
    const ctx = canvas.getContext('2d');

    let sensor = null;
    let animationFrameId = null;
    let mainInterval = null;
    
    // Config parameters
    const sampleRate = 100; 
    const maxDurationSeconds = 15;
    const bufferLength = 400; 
    
    // Buffers and tracking matrices
    let dataBuffer = new Array(bufferLength).fill(0);
    let markerBuffer = new Array(bufferLength).fill(false); // Flags to show detected peaks visually
    let sessionLog = []; 
    let startTime = 0;
    let recordTimeLeft = maxDurationSeconds;

    // --- Peak Detection Logic Helper Variables ---
    let sampleCounter = 0;
    let lastPeakIndex = 0;
    const minPeakDistanceSamples = sampleRate * 0.55; // Limits peaks to ~110 BPM max boundary
    let dynamicThreshold = 0.05; // Initial seed threshold

    // --- IIR Butterworth Bandpass Filter (1 Hz - 30 Hz @ 100 Hz Sampling) ---
    const b = [0.1215, 0, -0.2431, 0, 0.1215];
    const a = [1.0000, -2.1215, 1.9542, -0.8715, 0.1856];
    let x =;
    let y =;

    function processSignal(rawValue) {
        x.unshift(rawValue);
        x.pop();

        let filteredValue = (b[0] * x[0]) + (b[1] * x[1]) + (b[2] * x[2]) + (b[3] * x[3]) + (b[4] * x[4])
                            - (a[1] * y[0]) - (a[2] * y[1]) - (a[3] * y[2]) - (a[4] * y[3]);

        y.unshift(filteredValue);
        y.pop();

        return filteredValue;
    }

    // --- Canvas Rendering Window Loop (With Peak Markers) ---
    function resizeCanvas() {
        canvas.width = canvas.clientWidth * window.devicePixelRatio;
        canvas.height = canvas.clientHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawGraph() {
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        
        // Zero-line baseline reference
        ctx.strokeStyle = '#222222';
        ctx.beginPath();
        ctx.moveTo(0, canvas.clientHeight / 2);
        ctx.lineTo(canvas.clientWidth, canvas.clientHeight / 2);
        ctx.stroke();

        const step = canvas.clientWidth / bufferLength;
        const midY = canvas.clientHeight / 2;
        const scale = 200; // Amplifies microvolt accelerometer oscillations

        // Render the primary SCG Green Waveform
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < dataBuffer.length; i++) {
            let xPos = i * step;
            let yPos = midY - (dataBuffer[i] * scale);
            if (i === 0) ctx.moveTo(xPos, yPos);
            else ctx.lineTo(xPos, yPos);
        }
        ctx.stroke();

        // Render Red Triangle Markers above detected heartbeat peaks
        for (let i = 0; i < markerBuffer.length; i++) {
            if (markerBuffer[i] === true) {
                let xPos = i * step;
                let yPos = midY - (dataBuffer[i] * scale) - 15; // Suspend slightly above peak apex
                
                ctx.fillStyle = '#ff1744';
                ctx.beginPath();
                ctx.moveTo(xPos, yPos);          // Top corner of triangle
                ctx.lineTo(xPos - 5, yPos + 10); // Bottom left
                ctx.lineTo(xPos + 5, yPos + 10); // Bottom right
                ctx.closePath();
                ctx.fill();
            }
        }

        animationFrameId = requestAnimationFrame(drawGraph);
    }

    // --- On-The-Fly Heart Rate Tracking Engine ---
    function performRealTimePeakDetection(currentFilteredVal) {
        sampleCounter++;
        let isPeakDetected = false;

        // Maintain a rolling estimate of peak thresholding after the filter settles down
        if (sampleCounter > sampleRate * 2 && Math.abs(currentFilteredVal) > dynamicThreshold) {
            // Adaptively scale threshold bounds to prevent environmental drift locking
            dynamicThreshold = (dynamicThreshold * 0.98) + (Math.abs(currentFilteredVal) * 0.02);
        }

        // Evaluate local mathematical maxima criteria across standard shift windows
        let historicalLength = dataBuffer.length;
        let p0 = dataBuffer[historicalLength - 3];
        let p1 = dataBuffer[historicalLength - 2]; // Evaluation apex index target
        let p2 = dataBuffer[historicalLength - 1];

        if (p1 > p0 && p1 > p2 && p1 > (dynamicThreshold * 0.75)) {
            if ((sampleCounter - lastPeakIndex) > minPeakDistanceSamples) {
                isPeakDetected = true;
                lastPeakIndex = sampleCounter;
            }
        }
        return isPeakDetected;
    }

    // --- Final Post-Session Summary Calculator ---
    function finalizeBPMCalculation() {
        let detectedTimestamps = [];
        sessionLog.forEach(sample => {
            if (sample.isPeak === true) {
                detectedTimestamps.push(parseFloat(sample.time));
            }
        });

        // Ignore early transient samples from the first 2 seconds of calculation
        let filteredTimestamps = detectedTimestamps.filter(t => t > 2000);

        if (filteredTimestamps.length >= 3) {
            let intervals = [];
            for (let i = 1; i < filteredTimestamps.length; i++) {
                intervals.push(filteredTimestamps[i] - filteredTimestamps[i-1]);
            }
            let avgIntervalMs = intervals.reduce((s, c) => s + c, 0) / intervals.length;
            let calculatedBpm = Math.round(60000 / avgIntervalMs);

            if (calculatedBpm >= 45 && calculatedBpm <= 120) {
                bpmVal.textContent = calculatedBpm + " BPM";
                return;
            }
        }
        bpmVal.textContent = "-- BPM";
    }

    // --- Stage 1: Preparation Countdown Pipeline ---
    async function initPreparationPhase() {
        if (!('LinearAccelerationSensor' in window)) {
